name: Semgrep SAST

on:
  push:
    branches:
      - member-c
      - main
  pull_request:
    branches:
      - main

jobs:
  semgrep:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        run: |
          python -m pip install --upgrade pip
          pip install semgrep
          semgrep scan --config=auto .